<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Interpret</title>
<style>
  :root {
    --canvas: #F7F6F3;
    --panel: #FFFFFF;
    --border: #EAEAEA;
    --hairline: #E4E2DE;
    --ink: #111111;
    --muted: #787774;
    --faint: #A8A5A0;
    --listen-bg: #EDF3EC;
    --listen-fg: #346538;
    --speak-bg: #E1F3FE;
    --speak-fg: #1F6C9F;
    --num-bg: #FBF3DB;
    --num-fg: #956400;
    --err-bg: #FDEBEC;
    --err-fg: #9F2F2D;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, "Segoe UI", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

  /* Two full-bleed halves split by a single hairline. No floating cards. */
  .panel {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    padding: 26px 32px 22px;
    overflow: hidden;
  }
  .panel + .panel { border-left: 1px solid var(--hairline); }
  .panel--patient { transform: rotate(180deg); }

  .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Content hugs the talk button; a short turn sits beside its control. */
  .conversation {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    padding: 24px 0 18px;
    -webkit-overflow-scrolling: touch;
  }
  .conversation > :first-child { margin-top: auto; }

  .line { margin: 0 0 24px; }
  .line:last-child { margin-bottom: 0; }
  .own {
    font-size: 23px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .other {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
    margin-top: 5px;
  }
  .pending-own { color: var(--faint); }
  .num {
    background: var(--num-bg);
    color: var(--num-fg);
    border-radius: 5px;
    padding: 0 4px;
  }
  .flag {
    display: inline-block;
    margin-top: 6px;
    background: var(--num-bg);
    color: var(--num-fg);
    border-radius: 5px;
    padding: 1px 8px;
    font-size: 12px;
    font-weight: 600;
  }

  .numbers-note { font-size: 11px; color: var(--faint); margin: 0 0 10px; }

  /* The turn state is the primary affordance: dot + label, above the button. */
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    min-height: 22px;
    margin: 0 0 12px;
    transition: color 180ms var(--ease);
  }
  .status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.85;
    flex: none;
    transition: background 180ms var(--ease);
  }
  .status--listening { color: var(--listen-fg); }
  .status--translating { color: var(--speak-fg); }
  .status--error { color: var(--err-fg); }
  .status .retry {
    display: none;
    margin-left: 6px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    border-radius: 999px;
    padding: 3px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 160ms var(--ease-out);
  }
  .status--error .retry { display: inline-block; }
  .status .retry:active { transform: scale(0.96); }

  .talk {
    width: 100%;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--panel);
    color: var(--ink);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    padding: 30px 0;
    cursor: pointer;
    transition: background 180ms var(--ease), color 180ms var(--ease),
                border-color 180ms var(--ease), opacity 180ms var(--ease),
                transform 160ms var(--ease-out);
  }
  .talk:active:not(:disabled) { transform: scale(0.985); }
  .talk:disabled { opacity: 0.34; cursor: default; }
  .talk--listening {
    background: var(--listen-bg);
    color: var(--listen-fg);
    /* The pale fill alone is ~1.06:1 against white — invisible. The border and
       text carry the state; the wash is only reinforcement. */
    border-color: var(--listen-fg);
  }

  .footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--faint);
  }
  .footer-actions { display: flex; gap: 14px; align-items: baseline; }
  .save, .langs, .end, .mode, .cancel {
    border: none;
    background: none;
    padding: 0 0 1px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 1px solid var(--hairline);
    transition: color 160ms var(--ease), border-color 160ms var(--ease);
  }

  /* Hover only where there is a real pointer. */
  @media (hover: hover) and (pointer: fine) {
    .talk:hover:not(:disabled) { border-color: #D8D6D1; }
    .call:hover { color: var(--ink); border-color: var(--muted); }
  }

  .setup {
    position: fixed;
    inset: 0;
    background: var(--canvas);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .setup.hidden { display: none; }
  .setup-card .note { font-size: 14px; line-height: 1.55; color: var(--ink); margin: 0 0 12px; }
  .setup-card .note.zh { color: var(--muted); margin-bottom: 24px; }
  .setup-card #end-save { margin-bottom: 10px; }
  .setup-card #end-nosave { margin-bottom: 16px; }
  .setup-card #end-cancel { display: block; margin: 0 auto; }
  .start--quiet { background: var(--panel); color: var(--ink); border-color: var(--border); }
  .setup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 44px;
    width: min(430px, 90vw);
  }
  .setup-card h1 {
    font-size: 19px;
    letter-spacing: -0.01em;
    margin: 0 0 26px;
  }
  .field { margin: 0 0 18px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .field select {
    width: 100%;
    font-size: 16px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--ink);
    font-family: inherit;
  }
  .consent {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12px; line-height: 1.5; color: var(--muted);
    margin: 0 0 18px; cursor: pointer;
  }
  .consent input { margin-top: 2px; flex: none; }
  .consent strong { color: var(--ink); }
  .consent .zh { display: block; margin-top: 4px; }
  .start:disabled { opacity: 0.4; cursor: not-allowed; }
  .start {
    width: 100%;
    margin-top: 8px;
    font-family: inherit;
    border: 1px solid var(--ink);
    border-radius: 12px;
    background: var(--ink);
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 14px 0;
    cursor: pointer;
    transition: opacity 160ms var(--ease), transform 160ms var(--ease-out);
  }
  .start:active { transform: scale(0.985); }

  /* One-time entrance. Rare, so it earns a little motion. */
  @media (prefers-reduced-motion: no-preference) {
    .setup-card, .app { animation: rise 320ms var(--ease-out) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>
  <div class="setup hidden" id="endbox">
    <div class="setup-card">
      <h1>End this consultation?</h1>
      <p class="note">The translation session stops, the microphone is released, and you return to
      the setup page. The transcript is cleared unless you save it first.</p>
      <button class="start" id="end-save" type="button">Save transcript &amp; end</button>
      <button class="start start--quiet" id="end-nosave" type="button">End without saving</button>
      <button class="cancel" id="end-cancel" type="button">Cancel</button>
    </div>
  </div>

  <div class="setup" id="setup">
    <div class="setup-card">
      <h1>Interpretation setup</h1>
      <div class="field">
        <label for="doctor-lang">Doctor language</label>
        <select id="doctor-lang"></select>
      </div>
      <div class="field">
        <label for="patient-lang">Patient language</label>
        <select id="patient-lang"></select>
      </div>
      <label class="consent" for="consent">
        <input type="checkbox" id="consent">
        <span>
          <strong>Before you start:</strong> speech is sent to a cloud service to be translated
          automatically. This is <strong>not</strong> a medical interpreter.<br>
          <span class="zh">开始之前：语音会发送到云端服务进行自动翻译。这<strong>不是</strong>医疗翻译员。</span>
        </span>
      </label>
      <button class="start" id="start" disabled>Start</button>
    </div>
  </div>

  <div class="app">
    <div class="panel" data-role="doctor">
      <div class="label"></div>
      <div class="conversation"></div>
      <div class="numbers-note">Numbers need a human to confirm</div>
      <button class="talk">TALK</button>
      <div class="status"></div>
      <div class="footer">
        <div class="footer-actions">
          <button class="save">Save transcript</button>
          <button class="mode" type="button">Mode</button>
          <button class="langs">Change languages</button>
          <button class="end">End consultation</button>
        </div>
      </div>
    </div>
    <div class="panel panel--patient" data-role="patient">
      <div class="label"></div>
      <div class="conversation"></div>
      <div class="numbers-note">Numbers need a human to confirm</div>
      <button class="talk">TALK</button>
      <div class="status"></div>
      <div class="footer">
        <div class="footer-actions">
          <button class="save">Save transcript</button>
          <button class="mode" type="button">Mode</button>
          <button class="langs">Change languages</button>
          <button class="end">End consultation</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // [code, English name, native name]. Codes are BCP-47 tags the translation model
  // accepts as-is, except "zh", which the server maps to zh-Hans (kept as "zh" so
  // saved setups and the e2e suites still work). Priority languages first, then
  // everything else alphabetically by English name.
  var PRIORITY_LANGS = [
    ["ta", "Tamil", "தமிழ்"],
    ["id", "Indonesian", "Bahasa Indonesia"],
    ["vi", "Vietnamese", "Tiếng Việt"],
    ["hi", "Hindi", "हिन्दी"],
    ["zh", "Chinese, Simplified", "简体中文"],
    ["zh-Hant", "Chinese, Traditional", "繁體中文"],
    ["my", "Burmese", "မြန်မာ"],
    ["fil", "Filipino", "Filipino"],
    ["bn", "Bengali", "বাংলা"],
    ["ko", "Korean", "한국어"],
    ["ms", "Malay", "Bahasa Melayu"]
  ];
  var OTHER_LANGS = [
    ["af", "Afrikaans", "Afrikaans"], ["ak", "Akan", "Akan"], ["sq", "Albanian", "Shqip"],
    ["am", "Amharic", "አማርኛ"], ["ar", "Arabic", "العربية"], ["hy", "Armenian", "Հայերեն"],
    ["az", "Azerbaijani", "Azərbaycanca"], ["eu", "Basque", "Euskara"],
    ["be", "Belarusian", "Беларуская"], ["bg", "Bulgarian", "Български"],
    ["ca", "Catalan", "Català"], ["hr", "Croatian", "Hrvatski"], ["cs", "Czech", "Čeština"],
    ["da", "Danish", "Dansk"], ["nl", "Dutch", "Nederlands"], ["en", "English", "English"],
    ["et", "Estonian", "Eesti"], ["fi", "Finnish", "Suomi"], ["fr", "French", "Français"],
    ["gl", "Galician", "Galego"], ["ka", "Georgian", "ქართული"], ["de", "German", "Deutsch"],
    ["el", "Greek", "Ελληνικά"], ["gu", "Gujarati", "ગુજરાતી"], ["ha", "Hausa", "Hausa"],
    ["he", "Hebrew", "עברית"], ["hu", "Hungarian", "Magyar"], ["is", "Icelandic", "Íslenska"],
    ["it", "Italian", "Italiano"], ["ja", "Japanese", "日本語"], ["jv", "Javanese", "Basa Jawa"],
    ["kn", "Kannada", "ಕನ್ನಡ"], ["kk", "Kazakh", "Қазақ"], ["km", "Khmer", "ខ្មែរ"],
    ["rw", "Kinyarwanda", "Ikinyarwanda"], ["lo", "Lao", "ລາວ"], ["lv", "Latvian", "Latviešu"],
    ["lt", "Lithuanian", "Lietuvių"], ["mk", "Macedonian", "Македонски"],
    ["ml", "Malayalam", "മലയാളം"], ["mr", "Marathi", "मराठी"], ["mn", "Mongolian", "Монгол"],
    ["ne", "Nepali", "नेपाली"], ["no", "Norwegian", "Norsk"], ["fa", "Persian", "فارسی"],
    ["pl", "Polish", "Polski"], ["pt-BR", "Portuguese, Brazil", "Português (Brasil)"],
    ["pt-PT", "Portuguese, Portugal", "Português (Portugal)"], ["pa", "Punjabi", "ਪੰਜਾਬੀ"],
    ["ro", "Romanian", "Română"], ["ru", "Russian", "Русский"], ["sr", "Serbian", "Српски"],
    ["sd", "Sindhi", "سنڌي"], ["si", "Sinhala", "සිංහල"], ["sk", "Slovak", "Slovenčina"],
    ["sl", "Slovenian", "Slovenščina"], ["es", "Spanish", "Español"],
    ["su", "Sundanese", "Basa Sunda"], ["sw", "Swahili", "Kiswahili"],
    ["sv", "Swedish", "Svenska"], ["te", "Telugu", "తెలుగు"], ["th", "Thai", "ไทย"],
    ["tr", "Turkish", "Türkçe"], ["uk", "Ukrainian", "Українська"], ["ur", "Urdu", "اردو"],
    ["uz", "Uzbek", "Oʻzbek"], ["zu", "Zulu", "isiZulu"]
  ];
  var LANGS = {};  // code -> native name, for the panel labels
  PRIORITY_LANGS.concat(OTHER_LANGS).forEach(function (l) { LANGS[l[0]] = l[2]; });
  function fillLangSelect(id, selected) {
    var sel = document.getElementById(id);
    [["Priority languages", PRIORITY_LANGS], ["All other languages", OTHER_LANGS]].forEach(function (g) {
      var group = document.createElement("optgroup");
      group.label = g[0];
      g[1].forEach(function (l) {
        var o = document.createElement("option");
        o.value = l[0];
        o.textContent = l[1] === l[2] ? l[1] : l[2] + " (" + l[1] + ")";
        if (l[0] === selected) o.selected = true;
        group.appendChild(o);
      });
      sel.appendChild(group);
    });
  }
  fillLangSelect("doctor-lang", "en");
  fillLangSelect("patient-lang", "zh");
  var ROLES = { doctor: "Doctor", patient: "Patient" };
  // Input model (docs/starter-alignment-plan.md): like Google's starter, the mic is
  // ONE continuous 16 kHz stream of 100 ms PCM16 chunks for the whole session, and
  // the model's own activity detection decides where speech starts and ends. TALK
  // only ROUTES that stream to one person's translation session; releasing the
  // route makes the model flush the clause it is holding. Nothing here edits the
  // audio the model hears (no silence trimming, no fake padding, no turn markers).
  var SILENCE_THRESHOLD = 0.01;  // UI only: drives auto-release, never filters audio
                                 // (the model's input transcript also counts as speech)
  var SILENCE_MS = 3000;         // auto-release after this much quiet following speech
  var CHUNK = 1600; // 100 ms of 16 kHz mono PCM16

  var cfg = { doctor: "en", patient: "zh" };
  var streamingMode = "turn";
  var phase = "idle"; // idle | listening | translating | error | ended
  var active = null;  // doctor | patient | null
  var lines = [];
  // Output is attributed by SESSION: each person has their own translation session,
  // so whatever it emits belongs to that person's latest line, even if it arrives
  // after someone else has started talking.
  var lineBySide = { doctor: null, patient: null };
  var audioBuf = [];
  var QUIESCE_MS = 3000;      // this long with no *speech* from the model -> turn done
  var TURN_HARD_CAP_MS = 15000;
  // The model streams silence-padded audio continuously, so peak amplitude cannot
  // separate speech from padding (the padding still has a noise floor that clears a
  // small peak threshold). Energy can: measured padding is RMS ~0-11, speech is in
  // the hundreds and up.
  var AUDIO_RMS_MIN = 220;
  var PLAYOUT_LEAD_S = 0.25;  // jitter-buffer depth when playback (re)starts; see scheduleAudio()
  var quietTimer = null, capTimer = null;
  var playCtx = null, nextTime = 0, speechEnd = 0, turnHasSpeech = false, draining = false, drainTimer = null, lastOutputAt = 0;
  var turnSeq = 0, currentTurn = null, sawOutput = false, heardSound = false, turnCapTimer = null;
  var MAX_TURN_MS = 30000;   // hard ceiling so a turn can never stay open forever
  var COLD_GRACE_MS = 9000;   // longest we wait for a first token before handing over anyway
  var route = null;           // side the mic is routed to, mirrored to the server
  var connected = false;      // server said "ready": a route message will not be lost
  var micPending = false;     // getUserMedia / worklet setup in flight
  var sessionToken = 0;       // bumped by endSession so late async setup is discarded

  var ws = null;
  var audioCtx = null, sourceNode = null, processor = null, micStream = null;
  var pcmAccum = new Int16Array(0);
  var micMute = null;
  var lastSound = 0;
  var hasTurned = false;

  var panels = {
    doctor: document.querySelector('.panel[data-role="doctor"]'),
    patient: document.querySelector('.panel[data-role="patient"]')
  };

  function el(panel, sel) { return panels[panel].querySelector(sel); }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function renderText(s) {
    var esc = escapeHtml(toSimplified(s));
    return esc.replace(/(\d+(?:[.,]\d+)*)/g, '<span class="num">$1</span>');
  }

  // Plain-text record of the consult, for the clinician's notes. Both languages
  // per turn, with flagged turns marked.
  function transcriptText() {
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var who = ln.side === "doctor" ? "DOCTOR" : "PATIENT";
      var miss = missingNumbers(ln.source, ln.translation);
      out.push(who + ": " + toSimplified(ln.source));
      if (ln.translation) out.push("  -> " + toSimplified(ln.translation));
      // Carry the same caveats the screen shows. A record that silently drops the
      // warnings is worse than no record, because it reads as verified.
      if (!ln.source && !ln.translation) out.push("  [NOTHING CAPTURED]");
      else if (ln.source && !ln.translation && cfg.doctor !== cfg.patient) out.push("  [NO TRANSLATION]");
      else if (looksUnreliable(ln.source, ln.translation)) out.push("  [CHECK THE TRANSLATION]");
      else if (miss.length) out.push("  [CHECK THE NUMBER: " + miss.join(", ") + "]");
    }
    return out.join("\n") + "\n";
  }

  function downloadTranscript() {
    var blob = new Blob([transcriptText()], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "consult-transcript.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  // Number integrity. If the speaker said a number and the translation does not
  // carry it, the tool is hiding its own failure — the exact thing both users said
  // is worse than no tool. Spelled-out numbers are normalised first (EN + ZH) so
  // "five days" and 五天 are comparable.
  var NUMBER_WORDS = {
    one: 1, once: 1, two: 2, twice: 2, three: 3, thrice: 3, four: 4, five: 5,
    six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
    "一": 1, "二": 2, "两": 2, "三": 3, "四": 4, "五": 5,
    "六": 6, "七": 7, "八": 8, "九": 9, "十": 10
  };

  var ZH_DIGIT = { "一": "1", "二": "2", "两": "2", "三": "3", "四": "4",
                   "五": "5", "六": "6", "七": "7", "八": "8", "九": "9", "十": "10" };

  function numbersIn(s) {
    // Chinese writes decimals with 度, and the model may follow it with either a
    // digit ("38度5") or the numeral character ("38度五"). Fold both, plus the
    // Western decimal point, into one digit run so the forms compare equal.
    s = s.replace(/(\d)[.,](\d)/g, "$1$2")
         .replace(/(\d)度(\d)/g, "$1$2")
         .replace(/(\d)度([一二两三四五六七八九十])/g, function (_, a, b) {
           return a + (ZH_DIGIT[b] || b);
         });
    var out = [], re = /\d+(?:[.,]\d+)?|[A-Za-z]+|[一二两三四五六七八九十]/g, m;
    while ((m = re.exec(s))) {
      var t = m[0], v = null;
      if (/^\d/.test(t)) {
        // Digits only, so "38度5" (Chinese for 38.5) and "38.5" compare equal.
        v = t.replace(/\D/g, "");
      } else {
        var w = NUMBER_WORDS[t.toLowerCase()];
        if (w === undefined) w = NUMBER_WORDS[t];
        if (w !== undefined) v = String(w);
      }
      if (v === null) continue;
      // "one" / "一" is almost always an article or measure word ("one tablet",
      // "一天") rather than a quantity. Counting it made the flag cry wolf.
      if (v === "1") continue;
      out.push(v);
    }
    return out;
  }

  // The model sometimes renders a whole clause as one bare word instead of
  // translating it ("Me duele la cabeza." -> "Midway"). No numbers involved, so the
  // number check misses it — but it is exactly the "confidently wrong" failure both
  // users said they cannot live with, so it gets the same treatment.
  function looksUnreliable(source, translation) {
    if (!source || !translation) return false;
    var t = translation.trim();
    if (t.length < 2) return true;
    if (/[\u4e00-\u9fff]/.test(t)) return false;   // CJK target: word counting is meaningless

  function toSimplified(s) {
    return s.replace(/[\u4e00-\u9fff]/g, function (ch) {
      return TO_SIMPLIFIED[ch] || ch;
    });
  }

  var lastPanelHtml = { doctor: null, patient: null };

  function renderPanel(role) {
    var ownLang = role === "doctor" ? cfg.doctor : cfg.patient;
    var html = "";
    var items = lines;
    for (var i = 0; i < items.length; i++) {
      var ln = items[i];
      var isOwn = ln.side === role;
      var finalized = !!ln.closed;
      var visibleTranslation = (finalized || streamingMode === "realtime") ? ln.translation : "";
      var own = isOwn ? ln.source : visibleTranslation;
      var other = isOwn ? visibleTranslation : ln.source;
      html += '<div class="line">';
      if (own) {
        html += '<div class="own">' + renderText(own) + "</div>";
      } else if (!finalized) {
        html += '<div class="own pending-own">…</div>';
      }
      if (other) {
        html += '<div class="other">' + renderText(other) + "</div>";
      } else if (!finalized && !own) {
        html += '<div class="other">…</div>';
      }
      // Computed live, never stored: content can still arrive after a turn closes,
      // and a stale flag would keep crying wolf on a line that has since filled in.
      if (finalized && !ln.source && !ln.translation) {
        html += '<div class="flag">Nothing captured — please say that again · 没有听到，请再说一次</div>';
      } else if (finalized && ln.source && !ln.translation && cfg.doctor !== cfg.patient) {
        html += '<div class="flag">No translation — please check · 没有翻译，请检查</div>';
      } else if (finalized && looksUnreliable(ln.source, ln.translation)) {
        html += '<div class="flag">Check the translation · 请核对翻译</div>';
      } else if (finalized && numberMismatch(ln.source, ln.translation)) {
        var miss = missingNumbers(ln.source, ln.translation);
        html += '<div class="flag">Check the number · 请核对数字' +
                (miss.length ? " (" + miss.join(", ") + ")" : "") + "</div>";
      }
      html += "</div>";
    }
    el(role, ".label").textContent = (LANGS[ownLang] || ownLang) + " · " + ROLES[role];
    var conv = el(role, ".conversation");
    if (html !== lastPanelHtml[role]) {
      conv.innerHTML = html;
      lastPanelHtml[role] = html;
    }
    conv.scrollTop = conv.scrollHeight;
  }

  function statusText() {
    if (phase === "idle") return !connected ? "Connecting…" : hasTurned ? "Your turn" : "Ready";
    if (phase === "listening") return "Listening…";
    if (phase === "translating") {
      var listener = active === "doctor" ? "patient" : "doctor";
      return "Speaking to " + ROLES[listener];
    }
    if (phase === "error") return "Nothing was translated.";
    if (phase === "ended") return "Session ended";
    return "";
  }

  function renderStatus() {
    ["doctor", "patient"].forEach(function (role) {
      var st = el(role, ".status");
      st.className = "status";
      if (phase === "listening") st.classList.add("status--listening");
      if (phase === "translating") st.classList.add("status--translating");
      if (phase === "error") st.classList.add("status--error");
      st.innerHTML = statusText() +
        '<button class="retry">Retry</button>';
      var retry = st.querySelector(".retry");
      retry.onclick = retryAll;
    });
  }

  function renderButtons() {
    ["doctor", "patient"].forEach(function (role) {
      var btn = el(role, ".talk");
      btn.className = "talk";
      var isActive = phase === "listening" && active === role;
      var isDisabled = !connected || phase === "error" || phase === "ended" || phase === "translating" ||
        (phase === "listening" && active !== role);
      btn.disabled = isDisabled;
      if (isActive) btn.classList.add("talk--listening");
    });
  }

  function renderMode() {
    var label = streamingMode === "realtime" ? "Mode: Live" : "Mode: After turn";
    [].forEach.call(document.querySelectorAll(".mode"), function (button) {
      button.textContent = label;
      button.setAttribute("aria-pressed", streamingMode === "realtime" ? "true" : "false");
      button.title = streamingMode === "realtime"
        ? "Translation plays while the person is speaking"
        : "Translation plays after the person finishes speaking";
    });
  }

  function render() {
    renderPanel("doctor");
    renderPanel("patient");
    renderStatus();
    renderButtons();
    renderMode();
  }

  function wsUrl() {
    var proto = location.protocol === "https:" ? "wss" : "ws";
    return proto + "://" + location.host + "/ws";
  }

  function connect() {
    ws = new WebSocket(wsUrl());
    ws.onopen = function () {
      ws.send(JSON.stringify({ type: "config", doctor: cfg.doctor, patient: cfg.patient }));
    };
    ws.onmessage = function (ev) { onMessage(JSON.parse(ev.data)); };
    ws.onclose = function () { if (phase !== "error") onError("Connection closed"); };
    ws.onerror = function () { onError("Connection error"); };
  }

  function onMessage(m) {
    if (m.type === "ready") {
      streamingMode = m.streaming_mode === "realtime" ? "realtime" : "turn";
      connected = true;
      if (phase !== "listening" && phase !== "translating") phase = "idle";
      render();
    } else if (m.type === "streaming_mode") {
      streamingMode = m.streaming_mode === "realtime" ? "realtime" : "turn";
      if (streamingMode === "realtime" && audioBuf.length) scheduleAudio();
      render();
    } else if (m.type === "source") {
      var ls = lineBySide[m.side];
      if (!ls) return;                         // nobody on that side has spoken yet
      ls.source += m.text;
      // The model hearing words is the best speech detector we have: a quiet or
      // distant speaker may never cross SILENCE_THRESHOLD, but is still transcribed.
      if (phase === "listening" && m.side === active) { lastSound = performance.now(); heardSound = true; }
      // Only the active person's output counts toward THEIR turn: late text from
      // the previous speaker must neither end this turn early nor hold it open.
      if (m.side === active) sawOutput = true;
      render();
    } else if (m.type === "translation") {
      var lt = lineBySide[m.side];
      if (!lt) return;
      lt.translation += m.text;
      if (m.side === active) { sawOutput = true; markOutput(); }
      if (streamingMode === "realtime" || lt.closed) render();
    } else if (m.type === "audio") {
      // Only the active person's session contributes audio, and only while their
      // turn is open: an idle session keeps streaming silence-padded frames.
      if (m.side === active && (phase === "listening" || phase === "translating")) {
        var loud = b64Rms(m.b64) > AUDIO_RMS_MIN;
        audioBuf.push({ b64: m.b64, loud: loud });
        if (DEBUG_AUDIO && dbg.turn !== null) dbg.recv.push(b64Bytes(m.b64));
        if (draining || streamingMode === "realtime") scheduleAudio();
        if (loud) {
          sawOutput = true;
          markOutput();
        }
      }
    } else if (m.type === "turn_end") {
      if (m.side === active && phase === "translating") closeTurn();
    } else if (m.type === "error") {
      onError(m.raw || "API error");
    }
  }

  function startTalk(side) {
    if (phase !== "idle" || !connected) return;
    phase = "listening";
    active = side;
    turnSeq++;
    currentTurn = turnSeq;
    sawOutput = false;
    heardSound = false;
    var ln = { side: side, source: "", translation: "", turn: currentTurn, closed: false };
    lines.push(ln);
    lineBySide[side] = ln;
    audioBuf = [];
    turnHasSpeech = false;
    lastSound = performance.now();
    setRoute(side);
    dbgStartTurn(currentTurn);
    // Safety ceiling. A turn where no audio is ever captured does not auto-end
    // (that is deliberate, so a pause-before-speaking is not discarded), so it
    // must not be able to hang the session indefinitely either.
    if (turnCapTimer) clearTimeout(turnCapTimer);
    turnCapTimer = setTimeout(function () { if (phase === "listening") stopTalk(); }, MAX_TURN_MS);
    resumeStreaming();   // inside the tap gesture, so a suspended context is legal here
    ensureMic();
    render();
  }

  function stopTalk() {
    if (phase !== "listening") return;
    phase = "translating";
    setRoute(null);   // the server sends audio_stream_end: the model flushes its tail
    // The Live API never sends a "turn finished" signal, so the turn ends on a
    // drained playback queue plus model silence. See startDrain().
    startDrain();
    render();
  }

  function setRoute(side) {
    route = side;
    send({ type: "route", side: side });
  }

  function b64Rms(b64) {
    var bin = atob(b64), n = bin.length, sum = 0, count = 0;
    for (var i = 0; i + 1 < n; i += 2) {
      var v = bin.charCodeAt(i) | (bin.charCodeAt(i + 1) << 8);
      if (v >= 0x8000) v -= 0x10000;
      sum += v * v; count++;
    }
    return count ? Math.sqrt(sum / count) : 0;
  }

  function clearTurnTimers() {
    if (quietTimer) clearTimeout(quietTimer);
    if (capTimer) clearTimeout(capTimer);
    if (drainTimer) clearInterval(drainTimer);
    if (turnCapTimer && draining) { clearTimeout(turnCapTimer); turnCapTimer = null; }
    quietTimer = capTimer = drainTimer = null;
  }

  function markOutput() { lastOutputAt = performance.now(); }

  function ensurePlayCtx() {
    if (!playCtx) {
      playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      playOut = playCtx.createGain();
      playOut.connect(playCtx.destination);
      if (DEBUG_AUDIO) {
        dbg.tap = playCtx.createMediaStreamDestination();
        playOut.connect(dbg.tap);
      }
    }
    if (playCtx.state === "suspended") playCtx.resume();
  }

  // ---- Audio debug recorder (open the page with ?debugaudio) ----------------
  // Per turn, downloads three files when the turn closes:
  //   turnN-sent-16k.wav      the mic audio actually sent to the server
  //   turnN-received-24k.wav  every chunk the model sent, back to back, untouched
  //   turnN-played.webm       what the page actually sent to the speakers
  // Compare them: if "received" is choppy, the model is; if only "played" is,
  // playback is; if "sent" is choppy, capture is.
  var DEBUG_AUDIO = /[?&]debugaudio\b/.test(location.search);
  var playOut = null;
  var dbg = { tap: null, rec: null, webm: [], sent: [], recv: [], turn: null };

  function dbgStartTurn(turn) {
    if (!DEBUG_AUDIO) return;
    ensurePlayCtx();
    dbg.turn = turn; dbg.sent = []; dbg.recv = []; dbg.webm = [];
    try {
      dbg.rec = new MediaRecorder(dbg.tap.stream);
      dbg.rec.ondataavailable = function (e) { if (e.data.size) dbg.webm.push(e.data); };
      dbg.rec.start(1000);
    } catch (e) { dbg.rec = null; console.warn("[debugaudio] recorder failed", e); }
  }

  function dbgWav(chunks, rate) {
    var n = 0, i;
    for (i = 0; i < chunks.length; i++) n += chunks[i].byteLength;
    var out = new DataView(new ArrayBuffer(44 + n));
    function str(o, s) { for (var k = 0; k < s.length; k++) out.setUint8(o + k, s.charCodeAt(k)); }
    str(0, "RIFF"); out.setUint32(4, 36 + n, true); str(8, "WAVE"); str(12, "fmt ");
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
    out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true);
    out.setUint16(32, 2, true); out.setUint16(34, 16, true); str(36, "data"); out.setUint32(40, n, true);
    var off = 44;
    for (i = 0; i < chunks.length; i++) { new Uint8Array(out.buffer, off).set(new Uint8Array(chunks[i])); off += chunks[i].byteLength; }
    return new Blob([out.buffer], { type: "audio/wav" });
  }

  function dbgSave(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  }

  function dbgEndTurn() {
    if (!DEBUG_AUDIO || dbg.turn === null) return;
    var turn = dbg.turn, sent = dbg.sent, recv = dbg.recv, rec = dbg.rec;
    dbg.turn = null;
    dbgSave(dbgWav(sent, 16000), "turn" + turn + "-sent-16k.wav");
    dbgSave(dbgWav(recv, 24000), "turn" + turn + "-received-24k.wav");
    if (rec && rec.state !== "inactive") {
      rec.onstop = function () { dbgSave(new Blob(dbg.webm, { type: "audio/webm" }), "turn" + turn + "-played.webm"); };
      rec.stop();
    }
  }

  function b64Bytes(b64) {
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }

  // Plays whatever translation audio has arrived so far and keeps appending as
  // more streams in, gaplessly. Called repeatedly while a turn drains.
  //
  // The model delivers 250 ms chunks at exactly real-time pace, so the queue only
  // ever holds about one chunk of headroom. Two rules keep that headroom intact:
  //  - Silent chunks (padding, pauses between phrases) are not played, but they
  //    still advance the timeline by their duration. Skipping them outright used to
  //    cost 250 ms of headroom per pause, leaving the rest of the turn playing at
  //    the live edge (measured: 2-9 ms), where any stall is an audible gap.
  //  - When the queue does run dry, re-buffer PLAYOUT_LEAD_S before resuming.
  function scheduleAudio() {
    if (!audioBuf.length) return;
    ensurePlayCtx();
    for (var i = 0; i < audioBuf.length; i++) {
      var item = audioBuf[i];
      // Padding before the turn's first speech has no place on the timeline.
      if (!item.loud && !turnHasSpeech) continue;
      var bin = atob(item.b64);
      var bytes = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      var i16 = new Int16Array(bytes.buffer);
      if (!i16.length) continue;
      if (nextTime <= playCtx.currentTime) nextTime = playCtx.currentTime + PLAYOUT_LEAD_S;
      if (!item.loud) {
        // The model runs slightly faster than real time (~4%), so cap the queue
        // during silence rather than letting latency creep up over a long turn.
        if (nextTime - playCtx.currentTime < PLAYOUT_LEAD_S + 0.5) nextTime += i16.length / 24000;
        continue;
      }
      turnHasSpeech = true;
      var buf = playCtx.createBuffer(1, i16.length, 24000);
      var ch = buf.getChannelData(0);
      for (var k = 0; k < i16.length; k++) ch[k] = i16[k] / 0x8000;
      var node = playCtx.createBufferSource();
      node.buffer = buf;
      node.connect(playOut);
      var t = Math.max(playCtx.currentTime, nextTime);
      node.start(t);
      nextTime = t + buf.duration;
      speechEnd = nextTime;
    }
    audioBuf = [];
  }

  // A turn is over when BOTH hold: the model has produced no new speech for
  // QUIESCE_MS, and everything queued has finished playing. The model streams in
  // bursts, so a quiet-window-only rule closes turns mid-translation and splits
  // one utterance across two transcript lines.
  function startDrain() {
    draining = true;
    markOutput();
    var endedAt = performance.now();
    ensurePlayCtx();
    scheduleAudio();
    clearTurnTimers();
    drainTimer = setInterval(function () {
      var quiet = performance.now() - lastOutputAt > QUIESCE_MS;
      // speechEnd, not nextTime: the model streams padding forever, which keeps
      // advancing nextTime, so "nextTime reached" would never happen.
      var drained = playCtx.currentTime >= speechEnd - 0.05;
      // A cold session can take seconds to produce its first token, so never close
      // on a timer alone — but do not hang forever on a turn that says nothing.
      var graceExpired = performance.now() - endedAt > COLD_GRACE_MS;
      if (quiet && drained && (sawOutput || graceExpired)) closeTurn();
    }, 200);
    capTimer = setTimeout(function () { closeTurn(); }, TURN_HARD_CAP_MS);
  }

  function closeTurn() {
    clearTurnTimers();
    draining = false;
    for (var i = lines.length - 1; i >= 0; i--) {
      if (lines[i].turn === currentTurn) { lines[i].closed = true; break; }
    }
    hasTurned = true;
    active = null;
    phase = "idle";
    if (route !== null) setRoute(null);   // never leave the mic routed after a turn
    dbgEndTurn();
    render();
  }

  function onError(msg) {
    // Stop the turn machinery first: a drain timer left running would call
    // closeTurn(), reset phase to idle, and silently erase "Nothing was translated".
    clearTurnTimers();
    draining = false;
    phase = "error";
    active = null;
    audioBuf = [];
    // Release on the server too: a direction can fail while the socket stays open,
    // and the mic must not keep feeding a session the UI shows as failed.
    if (route !== null) setRoute(null);
    render();
  }

  // Real end: close the socket so the server tears down both upstream sessions,
  // release the microphone, and stop the playout. Callers then return to setup.
  function endSession() {
    sessionToken++;   // late getUserMedia / worklet callbacks see this and stand down
    micPending = false;
    connected = false;
    clearTurnTimers();
    draining = false;
    if (ws) {
      try { ws.onclose = ws.onerror = ws.onmessage = ws.onopen = null; ws.close(); } catch (e) {}
      ws = null;
    }
    if (micStream) { try { micStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} }
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
    if (playCtx) { try { playCtx.close(); } catch (e) {} }
    if (processor && processor.port) { try { processor.port.onmessage = null; } catch (e) {} }
    audioCtx = sourceNode = processor = micStream = micMute = null;
    route = null;
    playCtx = null; playOut = null; dbg.tap = null; nextTime = 0; speechEnd = 0;
    phase = "ended";
    active = null;
    render();
  }

  function retryAll() {
    // Detach first. The old socket's onclose would otherwise fire after the phase
    // was reset to idle and drop us straight back into the error state, making
    // Retry a no-op.
    if (ws) {
      try { ws.onclose = ws.onerror = ws.onmessage = ws.onopen = null; ws.close(); } catch (e) {}
    }
    clearTurnTimers();
    draining = false;
    lines = []; lineBySide = { doctor: null, patient: null }; audioBuf = []; phase = "idle"; active = null;
    route = null; connected = false;
    hasTurned = false;
    connect();
    render();
  }

  function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

  // Capture. An AudioWorklet hands over exactly one 100 ms chunk per 100 ms (the
  // spec's recommended size, evenly paced). Worklets need a secure context, so a
  // plain-http LAN tablet falls back to a ScriptProcessor feeding the same chunker.
  var WORKLET_SRC =
    "class Chunker extends AudioWorkletProcessor {" +
    "  constructor(){super();this.buf=new Float32Array(" + CHUNK + ");this.n=0;}" +
    "  process(inputs){var ch=inputs[0]&&inputs[0][0];if(!ch)return true;" +
    "    for(var i=0;i<ch.length;i++){this.buf[this.n++]=ch[i];" +
    "      if(this.n===this.buf.length){this.port.postMessage(this.buf);this.buf=new Float32Array(" + CHUNK + ");this.n=0;}}" +
    "    return true;}" +
    "}" +
    "registerProcessor('chunker', Chunker);";

  function ensureMic() {
    if (audioCtx) { resumeStreaming(); return; }
    // One mic per session: a second open (TALK tapped while the permission prompt
    // is up) would interleave two capture graphs and double every chunk.
    if (micPending) return;
    micPending = true;
    var token = sessionToken;
    navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    }).then(function (stream) {
      if (token !== sessionToken) {   // ended while the prompt was open
        stream.getTracks().forEach(function (t) { t.stop(); });
        return;
      }
      micPending = false;
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      // Created inside a promise callback, i.e. outside the user gesture that
      // started the session, so browsers hand it back SUSPENDED and it captures
      // nothing until resumed.
      if (audioCtx.state === "suspended") audioCtx.resume();
      sourceNode = audioCtx.createMediaStreamSource(stream);
      micMute = audioCtx.createGain(); micMute.gain.value = 0;
      micMute.connect(audioCtx.destination);
      lastSound = performance.now();
      var useWorklet = audioCtx.audioWorklet && typeof AudioWorkletNode === "function";
      if (useWorklet) {
        var url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
        var ctx = audioCtx;
        audioCtx.audioWorklet.addModule(url).then(function () {
          if (token !== sessionToken || ctx !== audioCtx) return;
          processor = new AudioWorkletNode(audioCtx, "chunker");
          processor.port.onmessage = function (e) { onChunk(e.data); };
          sourceNode.connect(processor);
          processor.connect(micMute);
        }).catch(function () {
          if (token === sessionToken && ctx === audioCtx) startScriptProcessor();
        });
      } else {
        startScriptProcessor();
      }
    }).catch(function () {
      micPending = false;
      if (token === sessionToken) onError("Microphone unavailable");
    });
  }

  function startScriptProcessor() {
    processor = audioCtx.createScriptProcessor(2048, 1, 1);
    processor.onaudioprocess = function (e) {
      var input = e.inputBuffer.getChannelData(0);
      var merged = new Float32Array(pcmAccum.length + input.length);
      merged.set(pcmAccum);
      merged.set(input, pcmAccum.length);
      var off = 0;
      for (; off + CHUNK <= merged.length; off += CHUNK) onChunk(merged.subarray(off, off + CHUNK));
      pcmAccum = merged.slice(off);
    };
    pcmAccum = new Float32Array(0);
    sourceNode.connect(processor);
    processor.connect(micMute);
  }

  function resumeStreaming() {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  // While translated speech plays from the tablet speaker and nobody holds the
  // mic, do not upload: the server keeps the last 300 ms of unrouted mic audio as
  // the next speaker's pre-roll, and that must not be the translation itself.
  function playbackActive() {
    return !!playCtx && playCtx.currentTime < speechEnd + 0.2;
  }

  // One 100 ms chunk of float samples from the capture graph.
  function onChunk(input) {
    var i16 = new Int16Array(input.length);
    var sum = 0;
    for (var i = 0; i < input.length; i++) {
      var s = Math.max(-1, Math.min(1, input[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      sum += s * s;
    }
    var now = performance.now();
    if (phase === "listening") {
      if (Math.sqrt(sum / input.length) > SILENCE_THRESHOLD) { lastSound = now; heardSound = true; }
      // UI convenience only: release the route after the speaker has said
      // something and then gone quiet. Every chunk is still streamed regardless.
      if (heardSound && now - lastSound > SILENCE_MS) stopTalk();
    }
    if (phase === "error" || phase === "ended") return;
    if (route === null && playbackActive()) return;
    sendAudio(i16);
  }

  function int16ToB64(i16) {
    var bytes = new Uint8Array(i16.buffer, i16.byteOffset, i16.byteLength);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function sendAudio(i16) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      // The mic streams from Start, before the socket is up and between turns;
      // only speech routed to a session is worth an error. Dropping routed speech
      // silently is the failure mode this tool must never have.
      if (route !== null && phase === "listening") onError("Connection lost");
      return;
    }
    if (DEBUG_AUDIO && dbg.turn !== null && route !== null) dbg.sent.push(i16.slice().buffer);
    send({ type: "audio", b64: int16ToB64(i16) });
  }

  // TALK button wiring.
  ["doctor", "patient"].forEach(function (role) {
    el(role, ".talk").addEventListener("click", function () {
      if (phase === "idle") startTalk(role);
      else if (phase === "listening" && active === role) stopTalk();
    });
  });

  // Setup. The last pair is only a DEFAULT: persisting it *and* skipping the setup
  // screen made the languages permanent, so a shared tablet handed patient 2 the
  // previous patient's languages with no way to change them.
  var saved = null;
  try { saved = localStorage.getItem("interpret.cfg"); } catch (e) {}
  if (saved) {
    try {
      var prev = JSON.parse(saved);
      if (LANGS[prev.doctor]) document.getElementById("doctor-lang").value = prev.doctor;
      if (LANGS[prev.patient]) document.getElementById("patient-lang").value = prev.patient;
    } catch (e) {}
  }
  var consent = document.getElementById("consent");
  var startBtn = document.getElementById("start");
  consent.addEventListener("change", function () { startBtn.disabled = !consent.checked; });
  startBtn.addEventListener("click", function () {
    if (!consent.checked) return;
    cfg.doctor = document.getElementById("doctor-lang").value;
    cfg.patient = document.getElementById("patient-lang").value;
    try { localStorage.setItem("interpret.cfg", JSON.stringify(cfg)); } catch (e) {}
    document.getElementById("setup").classList.add("hidden");
    // Open the microphone now rather than on the first tap. Creating the audio
    // context on demand races the speaker's first words and intermittently loses
    // the whole opening turn; priming it here means capture is live before anyone
    // speaks. The stream reaches a translation session only while TALK routes it.
    ensureMic();
    connect();
  });
  [].forEach.call(document.querySelectorAll(".langs"), function (b) {
    b.addEventListener("click", function () { location.reload(); });
  });
  [].forEach.call(document.querySelectorAll(".save"), function (b) {
    b.addEventListener("click", downloadTranscript);
  });
  [].forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.addEventListener("click", function () {
      var next = streamingMode === "realtime" ? "turn" : "realtime";
      send({ type: "set_streaming_mode", streaming_mode: next });
    });
  });
  // End consultation: ask once, and offer to keep the record.
  var endbox = document.getElementById("endbox");
  [].forEach.call(document.querySelectorAll(".end"), function (b) {
    b.addEventListener("click", function () { endbox.classList.remove("hidden"); });
  });
  document.getElementById("end-cancel").addEventListener("click", function () {
    endbox.classList.add("hidden");
  });
  // Ending returns to the setup page. Reloading (as "Change languages" does) is the
  // only reset that is guaranteed complete: it clears the transcript and re-gates
  // Start behind consent, so the next patient never inherits this consultation.
  function endAndReturnToSetup(delayMs) {
    endbox.classList.add("hidden");
    endSession();
    setTimeout(function () { location.reload(); }, delayMs || 0);
  }
  document.getElementById("end-save").addEventListener("click", function () {
    downloadTranscript();
    // Let the browser start the download before the page navigates away.
    endAndReturnToSetup(500);
  });
  document.getElementById("end-nosave").addEventListener("click", function () {
    endAndReturnToSetup(0);
  });

  render();
})();
</script>
</body>
</html>
